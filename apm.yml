name: agent-plugins-skills
version: 1.0.0
description: >-
  Install every skill in this repo into user scope (~/.claude/skills/) with one
  `apm install -g kuboon/agent-plugins`. Coexists with the Claude Code plugin
  marketplace (.claude-plugin/marketplace.json); this manifest is the APM entry.
author: Ohkubo KOHEI
targets:
  - claude
dependencies:
  apm:
    - kuboon/agent-plugins/plugins/github-actions-versions/skills/github-actions-versions
    - kuboon/agent-plugins/plugins/deno-remix-init/skills/deno-remix-init
    - kuboon/browser-how-to
    - kuboon/agent-plugins/plugins/github-page-preview/skills/github-page-preview
    - kuboon/agent-plugins/plugins/uint8array-base64/skills/uint8array-base64
    - kuboon/agent-plugins/plugins/remix-ui-text-field-editable/skills/remix-ui-text-field-editable
    - kuboon/agent-plugins/plugins/admin-view-toggle/skills/admin-view-toggle
    - kuboon/agent-plugins/plugins/deno-min-dep-age/skills/deno-min-dep-age
    - kuboon/agent-plugins/plugins/remix-v3-upgrade/skills/remix-v3-upgrade
    - kuboon/kuboon-remix-utils/plugins/remix-db-migrations-deno/skills/remix-db-migrations-deno
    - kuboon/agent-plugins/plugins/stacked-prs/skills/stacked-prs
    - kuboon/agent-plugins/plugins/game-feel/skills/game-feel
  mcp: []
includes: auto
